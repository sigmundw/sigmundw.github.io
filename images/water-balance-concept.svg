<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title desc">
<title id="title">A conceptual view of the water balance</title><desc id="desc">Precipitation falls onto a mountain basin. Some water returns to the atmosphere, some leaves as runoff, and some remains in terrestrial storage. Arrows do not represent measured quantities.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#ecf6ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="land" x2="0" y2="1"><stop stop-color="#b2cddc"/><stop offset="1" stop-color="#e0e9ee"/></linearGradient>
  <linearGradient id="water" x2="1" y2="0"><stop stop-color="#9ed3f3"/><stop offset="1" stop-color="#0071e3"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#287ab7"/></marker>
</defs>
<path d="M0 0H1000V460H0Z" fill="url(#sky)"/>
