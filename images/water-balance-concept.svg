<path d="m40 310 178-159 136 136 90-67 135 91 120-95 145 122 116-33v128H40Z" fill="#e3edf3"/>
<path d="m0 355 249-158 111 82 98 60 137-86 173 107 232-27v127H0Z" fill="url(#land)"/>
<path d="m199 229 50-32 58 43-36-8-23-18-17 22Z" fill="#fff"/>
<path d="M249 218c-18 60 41 66 86 89s-1 40 63 49 173-11 198 11-41 30 77 40 197-1 327 23" fill="none" stroke="url(#water)" stroke-width="13" stroke-linecap="round"/>
