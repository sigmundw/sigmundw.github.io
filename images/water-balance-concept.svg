<g fill="none" stroke="#287ab7" stroke-width="2" marker-end="url(#arrow)"><path d="M151 146v68"/><path d="M181 146v48"/><path d="M210 146v28"/><path d="M578 263c-20-45 26-62 9-117"/><path d="M622 286c-20-49 26-61 12-112"/><path d="M776 397q63 12 123 5"/></g>
<g font-family="-apple-system,Helvetica,Arial,sans-serif" fill="#24516c"><text x="94" y="40" font-size="16" font-weight="600">Precipitation</text><text x="504" y="122" font-size="16" font-weight="600">Evaporation</text><text x="832" y="365" font-size="16" font-weight="600">Runoff</text><text x="427" y="437" font-size="15">Terrestrial water storage</text></g>
